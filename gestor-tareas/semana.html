<title>Semana del equipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a paper week planner. Five weekday columns + one stacked weekend column, ruled lines, a "Someday" strip below. */
:root{
  --bg:#ffffff; --ink:#1c1d21; --muted:#8a8e97; --faint:#b9bcc3;
  --line:#ececef; --line-strong:#d9dade; --hover:#f5f6f8;
  --accent:#2b59e0; --accent-soft:#eaf0ff;
  --yellow:#e9b308; --yellow-bg:#fff3c4; --red:#e5484d; --red-bg:#fde0e0;
  --panel:#ffffff; --scrim:rgba(18,20,28,.32); --shadow:0 18px 50px rgba(20,24,40,.18);
  --font:"Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --row:34px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151619; --ink:#ececef; --muted:#8c909a; --faint:#5d6169;
  --line:#25272c; --line-strong:#34363d; --hover:#1d1f23;
  --accent:#7f9dff; --accent-soft:#1f2740;
  --yellow:#e8b923; --yellow-bg:#3b3213; --red:#ff6b6e; --red-bg:#40191c;
  --panel:#1c1e22; --scrim:rgba(0,0,0,.55); --shadow:0 18px 50px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151619; --ink:#ececef; --muted:#8c909a; --faint:#5d6169;
  --line:#25272c; --line-strong:#34363d; --hover:#1d1f23;
  --accent:#7f9dff; --accent-soft:#1f2740;
  --yellow:#e8b923; --yellow-bg:#3b3213; --red:#ff6b6e; --red-bg:#40191c;
  --panel:#1c1e22; --scrim:rgba(0,0,0,.55); --shadow:0 18px 50px rgba(0,0,0,.5);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
#app{max-width:1500px;margin:0 auto;padding-inline:clamp(16px,3vw,40px);padding-block:22px 60px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.month{font-size:clamp(26px,3.4vw,40px);font-weight:800;letter-spacing:-.02em;margin:0;text-transform:capitalize;line-height:1.1}
.month span{color:var(--faint);font-weight:700}
.nav{display:flex;align-items:center;gap:6px}
.nav button{height:34px;min-width:34px;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-weight:600}
.nav button:hover{background:var(--hover);color:var(--ink)}
.nav .today-btn{padding-inline:12px;border:1px solid var(--line-strong);color:var(--ink)}
.nav .today-btn[disabled]{opacity:.4;cursor:default;background:none}
.nav svg{width:18px;height:18px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-block:16px 6px}
.people{display:flex;gap:4px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding-inline:12px;border-radius:999px;color:var(--muted);font-weight:500}
.chip:hover{background:var(--hover);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.side{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:12.5px}
.legend{display:flex;gap:12px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.team-btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding-inline:10px;border-radius:8px;font-weight:500;color:var(--ink)}
.team-btn:hover{background:var(--hover)}
.team-btn svg{width:16px;height:16px}

.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:var(--accent-soft);margin-block:4px 10px;font-size:13.5px}
.banner b{font-weight:600}
.banner .pick{display:inline-flex;align-items:center;gap:6px;height:28px;padding-inline:10px;border-radius:999px;background:var(--bg);font-weight:500}
.banner .pick:hover{outline:1px solid var(--accent)}
.banner .act{color:var(--accent);font-weight:600}

/* week grid */
.week{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));column-gap:22px;margin-top:8px}
.day{min-width:0;display:flex;flex-direction:column}
.weekend{display:flex;flex-direction:column;gap:18px;min-width:0}
.dh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.dh b{font-size:15px;font-weight:700}
.dh span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.day.past .dh{border-bottom-color:var(--line-strong)}
.day.past .dh b{color:var(--muted)}
.day.is-today .dh{border-bottom-color:var(--accent)}
.day.is-today .dh b,.day.is-today .dh span{color:var(--accent)}
ul.lines{list-style:none;margin:0;padding:0;flex:1}
ul.lines.over{background:var(--accent-soft);border-radius:6px}
.row{height:var(--row);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;position:relative;min-width:0}
.row.empty{cursor:text}
.row.empty.locked{cursor:default}
.task .txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:3px 6px;margin-left:-6px;border-radius:5px;line-height:1.35}
.task.can .txt{cursor:text}
.task.st-proceso .txt{background:var(--yellow-bg)}
.task.st-atascado .txt{background:var(--red-bg)}
.task.done .txt{color:var(--faint);text-decoration:line-through;background:none}
.st{width:14px;height:14px;flex:none;display:grid;place-items:center;margin-left:-2px;border-radius:50%}
.st::before{content:"";width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line-strong);transition:transform .12s}
.task:not(:hover) .st.none::before{box-shadow:none}
.st:hover::before{transform:scale(1.3)}
.st.proceso::before{background:var(--yellow);box-shadow:none}
.st.atascado::before{background:var(--red);box-shadow:none}
.task.done .st::before{opacity:.35}
.task:not(.can) .st{cursor:default}
.task:not(.can) .st:hover::before{transform:none}
.who{width:18px;height:18px;border-radius:50%;background:var(--c);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;flex:none}
.task.done .who{opacity:.4}
.roll{color:var(--faint);font-size:12px;flex:none;cursor:default}
.chk{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;color:transparent;box-shadow:inset 0 0 0 1.5px var(--line-strong);opacity:0;transition:opacity .1s}
.chk svg{width:11px;height:11px}
.task.can:hover .chk,.chk:focus-visible{opacity:1}
.chk:hover{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent)}
.task.done .chk{opacity:1;background:var(--line);box-shadow:none;color:var(--muted)}
.task[draggable="true"]{cursor:grab}
.task.dragging{opacity:.4}
.edit{flex:1;min-width:0;height:28px;border:0;background:transparent;color:var(--ink);font:inherit;outline:none;padding:0}
.row.editing{border-bottom-color:var(--accent)}

/* someday */
.someday{margin-top:42px}
.someday .dh{border-bottom-color:var(--line-strong)}
.someday .dh b{color:var(--muted)}
.someday ul.lines{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));column-gap:22px}

/* team panel */
.scrim{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:start center;padding:8vh 16px 16px;z-index:10;overflow:auto}
.panel{width:min(620px,100%);background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:22px 22px 18px}
.panel h2{margin:0 0 4px;font-size:20px;font-weight:700;letter-spacing:-.01em}
.panel .sub{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.5;max-width:60ch}
.mem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding-block:12px;border-top:1px solid var(--line)}
.mem .sw{width:22px;height:22px;border-radius:50%;background:var(--c)}
.mem .name{font:inherit;font-size:15px;font-weight:600;color:var(--ink);background:transparent;border:0;border-bottom:1px solid transparent;padding:2px 0;width:100%}
.mem .name:hover,.mem .name:focus{border-bottom-color:var(--line-strong);outline:none}
.mem .meta{grid-column:2/4;display:flex;gap:14px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.mem .meta button{color:var(--accent);font-weight:500}
.mem .meta .danger{color:var(--red)}
.mem .linked{color:var(--ink)}
.tog{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--ink);font-size:12.5px}
.tog input{appearance:none;width:30px;height:18px;border-radius:999px;background:var(--line-strong);position:relative;cursor:pointer;margin:0;transition:background .15s}
.tog input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.tog input:checked{background:var(--accent)}
.tog input:checked::after{transform:translateX(12px)}
.tog input:disabled{opacity:.5;cursor:default}
.add{display:flex;gap:8px;margin-top:12px;border-top:1px solid var(--line);padding-top:14px}
.add input{flex:1;min-width:0;height:36px;border:1px solid var(--line-strong);border-radius:8px;padding-inline:12px;background:var(--bg);color:var(--ink);font:inherit}
.btn{height:36px;padding-inline:14px;border-radius:8px;background:var(--ink);color:var(--bg);font-weight:600}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line-strong)}
.panel .foot{display:flex;justify-content:flex-end;margin-top:16px}
.confirm{grid-column:2/4;display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--red)}
.confirm button{font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}

@media (max-width:900px){
  .week{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:26px}
  .weekend{grid-column:span 2;display:grid;grid-template-columns:1fr 1fr;column-gap:22px}
}
@media (max-width:560px){
  .week{grid-template-columns:1fr}
  .weekend{grid-column:auto;grid-template-columns:1fr;row-gap:26px}
  .chk{opacity:.6}
  .legend{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app"></div>
<div class="toast" id="toast" hidden></div>

<script>
const DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const MON=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MON3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const PALETTE=['#e5484d','#f76b15','#2f9e5a','#0d9488','#0b7bd6','#6e56cf','#c2378a','#8a6a00'];
const STATUS=[null,'proceso','atascado'];
const STATUS_LABEL={proceso:'En proceso',atascado:'Atascado'};
const SOMEDAY='someday';

const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-((x.getDay()+6)%7))};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtShort=s=>{const d=parse(s);return d.getDate()+' '+MON3[d.getMonth()]};

function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

const st={
  live:false, demo:false, loading:true, readOnly:false,
  me:null, isOwner:false, db:null,
  members:[], tasks:[],
  view:store('semana.view')||'all',
  week:mondayOf(new Date()), today:iso(new Date()),
  editing:null, teamOpen:false, confirmDel:null,
  rendering:false, pending:false, narrow:innerWidth<=560
};

/* ---------- permissions ---------- */
const myMember=()=>st.members.find(m=>m.uid&&m.uid===st.me)||null;
const memberById=id=>st.members.find(m=>m.id===id)||null;
function canEditFor(ownerId){
  if(st.readOnly||st.loading)return false;
  if(st.isOwner)return true;
  const m=myMember();
  return !!m&&(m.id===ownerId||!!m.editOthers);
}
function newOwner(){
  if(st.view!=='all')return memberById(st.view)?st.view:null;
  const m=myMember(); if(m)return m.id;
  return null;
}
const canAdd=()=>{const o=newOwner();return !!o&&canEditFor(o)};

/* ---------- task placement: unfinished past tasks roll to today ---------- */
function effKey(t){
  if(!t.date)return SOMEDAY;
  if(!t.done&&t.date<st.today)return st.today;
  return t.date;
}
const visible=t=>st.view==='all'||t.owner===st.view;
function tasksFor(key){
  return st.tasks.filter(t=>visible(t)&&effKey(t)===key).sort((a,b)=>(a.order||0)-(b.order||0));
}

/* ---------- data layer (live db or local example) ---------- */
let api;
function liveApi(db){
  const run=async fn=>{try{await fn()}catch(e){
    const c=e&&e.code;
    if(c==='invalid_argument'){toast('No tienes permiso para guardar cambios en esta página.');st.readOnly=true;render()}
    else if(c==='quota_exceeded')toast('La base de datos está llena. Borra tareas antiguas para seguir añadiendo.');
    else toast('No se pudo guardar el cambio. Comprueba la conexión e inténtalo de nuevo.');
  }};
  return{
    addTask:d=>run(()=>db.collection('tasks').add(d)),
    updTask:(id,p)=>run(()=>db.doc('tasks/'+id).update(p)),
    delTask:id=>run(()=>db.doc('tasks/'+id).delete()),
    addMember:d=>run(()=>db.collection('members').add(d)),
    updMember:(id,p)=>run(()=>db.doc('members/'+id).update(p)),
    delMember:async id=>{
      for(const t of st.tasks.filter(t=>t.owner===id))await run(()=>db.doc('tasks/'+t.id).delete());
      await run(()=>db.doc('members/'+id).delete());
    }
  };
}
function demoApi(){
  let n=1000;
  return{
    addTask:d=>{st.tasks.push({id:'d'+(n++),...d});requestRender()},
    updTask:(id,p)=>{const t=st.tasks.find(t=>t.id===id);if(t)Object.assign(t,p);requestRender()},
    delTask:id=>{st.tasks=st.tasks.filter(t=>t.id!==id);requestRender()},
    addMember:d=>{st.members.push({id:'m'+(n++),...d});requestRender()},
    updMember:(id,p)=>{const m=memberById(id);if(m)Object.assign(m,p);requestRender()},
    delMember:id=>{st.tasks=st.tasks.filter(t=>t.owner!==id);st.members=st.members.filter(m=>m.id!==id);if(st.view===id)st.view='all';requestRender()}
  };
}

/* ---------- rendering ---------- */
const app=document.getElementById('app');
const ICON={
  prev:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg>',
  next:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4.5 13 10l-5.5 5.5"/></svg>',
  check:'<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.3 5 8.7l4.5-5.4"/></svg>',
  team:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="7.5" cy="7" r="2.8"/><path d="M2.5 16c.6-2.8 2.6-4.3 5-4.3s4.4 1.5 5 4.3"/><circle cx="14" cy="7.8" r="2.2"/><path d="M13.6 11.8c2 .1 3.4 1.4 3.9 3.6"/></svg>'
};

function monthTitle(){
  const a=st.week,b=addDays(st.week,6);
  if(a.getMonth()===b.getMonth())return `${MON[a.getMonth()]} <span>${a.getFullYear()}</span>`;
  const y=a.getFullYear()===b.getFullYear()?` <span>${b.getFullYear()}</span>`:` <span>${a.getFullYear()}/${b.getFullYear()}</span>`;
  return `${MON3[a.getMonth()]} – ${MON3[b.getMonth()]}${y}`;
}

function header(){
  const thisWeek=iso(st.week)===iso(mondayOf(parse(st.today)));
  const chips=[`<button class="chip ${st.view==='all'?'on':''}" data-view="all">Todos</button>`]
    .concat(st.members.map(m=>`<button class="chip ${st.view===m.id?'on':''}" data-view="${esc(m.id)}"><span class="dot" style="--c:${esc(m.color)}"></span>${esc(m.name)}</button>`));
  return `<div class="top"><h1 class="month">${monthTitle()}</h1>
    <div class="nav">
      <button class="today-btn" data-act="today" ${thisWeek?'disabled':''}>Hoy</button>
      <button data-act="prev" aria-label="Semana anterior">${ICON.prev}</button>
      <button data-act="next" aria-label="Semana siguiente">${ICON.next}</button>
    </div></div>
    <div class="bar"><div class="people">${chips.join('')}</div>
      <div class="side"><div class="legend"><span><i style="background:var(--yellow)"></i>En proceso</span><span><i style="background:var(--red)"></i>Atascado</span></div>
      <button class="team-btn" data-act="team">${ICON.team}Equipo</button></div></div>`;
}

function banner(){
  if(st.loading)return '';
  if(st.demo){
    const opts=[{id:'__owner',name:'Administrador'}].concat(st.members);
    const cur=st.isOwner?'__owner':(myMember()||{}).id;
    return `<div class="banner"><b>Ejemplo.</b> No hay conexión con la base de datos, así que se muestran personas y tareas de muestra que no se guardan. Ver como:
      ${opts.map(o=>`<button class="pick" data-demo-as="${esc(o.id)}" style="${o.id===cur?'outline:1px solid var(--accent)':''}">${o.color?`<span class="dot" style="--c:${esc(o.color)}"></span>`:''}${esc(o.name)}</button>`).join('')}</div>`;
  }
  if(st.readOnly)return `<div class="banner">Solo lectura. Pide al administrador acceso de edición para poder cambiar tareas.</div>`;
  if(!st.me)return `<div class="banner">Inicia sesión en Claude para poder editar tareas.</div>`;
  if(myMember())return '';
  if(!st.members.length){
    return st.isOwner
      ?`<div class="banner"><b>Empieza por tu equipo.</b> Añade a las personas que van a tener tareas. <button class="act" data-act="team">Añadir personas</button></div>`
      :`<div class="banner">El administrador todavía no ha añadido al equipo.</div>`;
  }
  const free=st.members.filter(m=>!m.uid);
  if(free.length)return `<div class="banner"><b>¿Quién eres?</b> Elige tu nombre para poder editar tus tareas:
      ${free.map(m=>`<button class="pick" data-claim="${esc(m.id)}"><span class="dot" style="--c:${esc(m.color)}"></span>${esc(m.name)}</button>`).join('')}</div>`;
  return st.isOwner?'':`<div class="banner">Tu cuenta no está vinculada a nadie del equipo. Pide al administrador que te añada.</div>`;
}

function taskRow(t){
  const e=st.editing;
  if(e&&e.id===t.id)return `<li class="row editing"><input class="edit" id="edit-input" value="${esc(e.draft)}" aria-label="Editar tarea" autocomplete="off"></li>`;
  const can=canEditFor(t.owner);
  const s=t.status||null;
  const m=memberById(t.owner);
  const rolled=!t.done&&t.date&&t.date<st.today;
  return `<li class="row task ${can?'can':''} ${t.done?'done':''} ${s?'st-'+s:''}" data-id="${esc(t.id)}" ${can?'draggable="true"':''}>
    <button class="st ${s||'none'}" data-act="status" aria-label="Estado: ${s?STATUS_LABEL[s]:'sin etiqueta'}" title="${s?STATUS_LABEL[s]:(can?'Marcar estado':'')}" ${can?'':'tabindex="-1"'}></button>
    <span class="txt" title="${esc(t.text)}">${esc(t.text)}</span>
    ${rolled?`<span class="roll" title="Pendiente desde el ${fmtShort(t.date)}">↻</span>`:''}
    ${st.view==='all'&&m?`<span class="who" style="--c:${esc(m.color)}" title="${esc(m.name)}">${esc((m.name||'?').trim().charAt(0).toUpperCase())}</span>`:''}
    ${can?`<button class="chk" data-act="done" aria-label="${t.done?'Marcar como pendiente':'Completar'}">${ICON.check}</button>`:''}
  </li>`;
}

function lines(key,min){
  const list=tasksFor(key);
  const e=st.editing;
  const add=canAdd();
  let html=list.map(taskRow).join('');
  const total=Math.max(min,list.length+1);
  let usedNew=false;
  for(let i=list.length;i<total;i++){
    if(e&&!e.id&&e.key===key&&!usedNew){usedNew=true;html+=`<li class="row editing"><input class="edit" id="edit-input" value="${esc(e.draft)}" aria-label="Nueva tarea" autocomplete="off"></li>`;continue}
    html+=`<li class="row empty ${add?'':'locked'}" data-key="${key}"></li>`;
  }
  return `<ul class="lines" data-key="${key}">${html}</ul>`;
}

function dayCol(i,min){
  const d=addDays(st.week,i),k=iso(d);
  const cls=k===st.today?'is-today':(k<st.today?'past':'');
  return `<section class="day ${cls}"><div class="dh"><b>${DAYS[i]}</b><span>${d.getDate()} ${MON3[d.getMonth()]}</span></div>${lines(k,min)}</section>`;
}

function week(){
  const wd=st.narrow?3:11, we=st.narrow?3:4;
  let h='<div class="week">';
  for(let i=0;i<5;i++)h+=dayCol(i,wd);
  h+=`<div class="weekend">${dayCol(5,we)}${dayCol(6,we)}</div></div>`;
  return h;
}

function someday(){
  return `<section class="someday"><div class="dh"><b>Algún día</b><span>sin fecha</span></div>${lines(SOMEDAY,st.narrow?3:8)}</section>`;
}

function team(){
  const own=st.isOwner, me=myMember();
  const rows=st.members.map(m=>{
    const n=st.tasks.filter(t=>t.owner===m.id).length;
    const confirm=st.confirmDel===m.id
      ?`<div class="confirm">¿Eliminar a ${esc(m.name)}${n?` y sus ${n} tareas`:''}? <button data-act="del-yes" data-id="${esc(m.id)}">Eliminar</button><button data-act="del-no" style="color:var(--ink)">Cancelar</button></div>`:'';
    let link='';
    if(st.demo)link='';
    else if(m.uid)link=`<span class="linked">${m.uid===st.me?'Eres tú':'Cuenta vinculada'}</span>${own?`<button data-act="unlink" data-id="${esc(m.id)}">Desvincular</button>`:''}`;
    else link=`<span>Sin cuenta vinculada</span>${!me&&st.me&&!st.readOnly?`<button data-claim="${esc(m.id)}">Soy yo</button>`:''}`;
    return `<div class="mem">
      <button class="sw" style="--c:${esc(m.color)}" ${own?`data-act="color" data-id="${esc(m.id)}" title="Cambiar color"`:'disabled'} aria-label="Color de ${esc(m.name)}"></button>
      ${own?`<input class="name" id="mname-${esc(m.id)}" data-id="${esc(m.id)}" value="${esc(m.name)}" aria-label="Nombre">`:`<span class="name">${esc(m.name)}</span>`}
      ${own?`<button data-act="del" data-id="${esc(m.id)}" style="color:var(--muted);font-size:12.5px">Eliminar</button>`:'<span></span>'}
      <div class="meta">
        <label class="tog"><input type="checkbox" id="edit-${esc(m.id)}" data-act="perm" data-id="${esc(m.id)}" ${m.editOthers?'checked':''} ${own?'':'disabled'}>Puede editar tareas de los demás</label>
        ${link}
      </div>${confirm}</div>`;
  }).join('');
  return `<div class="scrim" data-act="close-bg"><div class="panel" role="dialog" aria-modal="true" aria-labelledby="team-h">
    <h2 id="team-h">Equipo</h2>
    <p class="sub">Cada persona tiene su propia lista de tareas. Todas pueden editar las suyas; activa el interruptor para que alguien pueda editar también las de los demás.${st.demo?'':' Cada persona entra con su cuenta de Claude y elige su nombre la primera vez.'}${own?'':' Solo el administrador puede cambiar el equipo.'}</p>
    ${rows||'<p class="sub">Todavía no hay nadie en el equipo.</p>'}
    ${own?`<form class="add" id="add-form"><input id="new-member" placeholder="Nombre de la persona" autocomplete="off"><button class="btn" type="submit">Añadir</button></form>`:''}
    <div class="foot"><button class="btn ghost" data-act="close">Cerrar</button></div>
  </div></div>`;
}

function render(){
  const a=document.activeElement;
  if(a&&a!==document.body&&a.tagName==='INPUT'&&a.id!=='edit-input'&&app.contains(a)&&a.type!=='checkbox'){st.pending=true;return}
  st.pending=false;
  const caret=a&&a.id==='edit-input'?a.selectionStart:null;
  st.rendering=true;
  app.innerHTML=header()+banner()+week()+someday()+(st.teamOpen?team():'');
  st.rendering=false;
  const inp=document.getElementById('edit-input');
  if(inp){inp.focus();const p=caret??inp.value.length;try{inp.setSelectionRange(p,p)}catch(e){}}
}

/* ---------- editing ---------- */
function commitEdit(){
  const e=st.editing; if(!e)return;
  st.editing=null;
  const text=(e.draft||'').trim();
  if(e.id){
    const t=st.tasks.find(t=>t.id===e.id); if(!t)return;
    if(!text)api.delTask(e.id); else if(text!==t.text)api.updTask(e.id,{text});
  }else if(text){
    api.addTask({owner:e.owner,text,date:e.key===SOMEDAY?null:e.key,done:false,status:null,order:Date.now()});
  }
}
function startNew(key){
  const owner=newOwner();
  if(!owner||!canEditFor(owner)){
    if(!st.loading&&!st.readOnly&&st.view==='all'&&!myMember()&&st.members.length)toast('Elige una persona arriba para añadirle tareas.');
    return;
  }
  commitEdit();
  st.editing={key,owner,draft:''};
  render();
}
function startEdit(id){
  const t=st.tasks.find(t=>t.id===id); if(!t||!canEditFor(t.owner))return;
  commitEdit();
  st.editing={id,draft:t.text};
  render();
}
function toggleDone(id){
  const t=st.tasks.find(t=>t.id===id); if(!t||!canEditFor(t.owner))return;
  commitEdit();
  const p={done:!t.done};
  if(!t.done&&t.date&&t.date<st.today)p.date=st.today;
  api.updTask(id,p); render();
}
function cycleStatus(id){
  const t=st.tasks.find(t=>t.id===id); if(!t||!canEditFor(t.owner))return;
  commitEdit();
  const next=STATUS[(STATUS.indexOf(t.status||null)+1)%STATUS.length];
  api.updTask(id,{status:next}); render();
}

/* While a pointer is down, hold back re-renders so the element under it survives until its click. */
let pointerDown=false, needRender=false;
function requestRender(){if(pointerDown)needRender=true;else render()}
document.addEventListener('mousedown',()=>{pointerDown=true},true);
document.addEventListener('mouseup',()=>setTimeout(()=>{pointerDown=false;if(needRender){needRender=false;render()}}),true);

/* rows and task buttons act on mousedown so the open input keeps focus */
app.addEventListener('mousedown',ev=>{
  if(ev.button!==0)return;
  const el=ev.target.closest('[data-act="done"],[data-act="status"],.row.empty');
  if(!el)return;
  ev.preventDefault();
  const li=el.closest('li');
  if(el.matches('[data-act="done"]'))toggleDone(li.dataset.id);
  else if(el.matches('[data-act="status"]'))cycleStatus(li.dataset.id);
  else startNew(li.dataset.key);
});

app.addEventListener('click',ev=>{
  const t=ev.target;
  const txt=t.closest('.task.can .txt');
  if(txt){startEdit(txt.closest('li').dataset.id);return}
  // keyboard activation of task buttons (mouse handled on mousedown)
  if(ev.detail===0){
    const b=t.closest('[data-act="done"],[data-act="status"]');
    if(b){const id=b.closest('li').dataset.id;b.dataset.act==='done'?toggleDone(id):cycleStatus(id);return}
  }
  const v=t.closest('[data-view]');
  if(v){st.view=v.dataset.view;store('semana.view',st.view);commitEdit();render();return}
  const claim=t.closest('[data-claim]');
  if(claim){api.updMember(claim.dataset.claim,{uid:st.me});return}
  const demoAs=t.closest('[data-demo-as]');
  if(demoAs){const id=demoAs.dataset.demoAs;st.isOwner=id==='__owner';st.members.forEach(m=>m.uid=m.id===id?'demo-me':null);commitEdit();render();return}
  const a=t.closest('[data-act]'); if(!a)return;
  const act=a.dataset.act, id=a.dataset.id;
  if(act==='close-bg'&&t!==a)return;
  switch(act){
    case 'prev':commitEdit();st.week=addDays(st.week,-7);render();break;
    case 'next':commitEdit();st.week=addDays(st.week,7);render();break;
    case 'today':commitEdit();st.week=mondayOf(parse(st.today));render();break;
    case 'team':commitEdit();st.teamOpen=true;render();setTimeout(()=>{const i=document.getElementById('new-member');i&&!st.members.length&&i.focus()});break;
    case 'close':case 'close-bg':st.teamOpen=false;st.confirmDel=null;render();break;
    case 'color':{const m=memberById(id);api.updMember(id,{color:PALETTE[(PALETTE.indexOf(m.color)+1)%PALETTE.length]});break}
    case 'unlink':api.updMember(id,{uid:null});break;
    case 'del':st.confirmDel=id;render();break;
    case 'del-no':st.confirmDel=null;render();break;
    case 'del-yes':st.confirmDel=null;if(st.view===id){st.view='all';store('semana.view','all')}api.delMember(id);render();break;
  }
});

app.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.act==='perm')api.updMember(t.dataset.id,{editOthers:t.checked});
  else if(t.classList.contains('name')){const v=t.value.trim();const m=memberById(t.dataset.id);if(v&&m&&v!==m.name)api.updMember(t.dataset.id,{name:v})}
});
app.addEventListener('submit',ev=>{
  ev.preventDefault();
  const i=document.getElementById('new-member');const name=i.value.trim();if(!name)return;
  const used=st.members.map(m=>m.color);
  const color=PALETTE.find(c=>!used.includes(c))||PALETTE[st.members.length%PALETTE.length];
  i.value='';
  api.addMember({name,color,uid:null,editOthers:false,order:Date.now()});
  setTimeout(()=>{const n=document.getElementById('new-member');n&&n.focus()},50);
});
app.addEventListener('input',ev=>{if(ev.target.id==='edit-input'&&st.editing)st.editing.draft=ev.target.value});
app.addEventListener('keydown',ev=>{
  if(ev.target.id!=='edit-input')return;
  if(ev.key==='Enter'){ev.preventDefault();const e=st.editing;commitEdit();if(e&&!e.id&&e.draft.trim())st.editing={key:e.key,owner:e.owner,draft:''};render()}
  else if(ev.key==='Escape'){st.editing=null;render()}
});
app.addEventListener('focusout',ev=>{
  if(st.rendering)return;
  if(ev.target.id==='edit-input'){commitEdit();setTimeout(requestRender)}
  else if(st.pending)setTimeout(requestRender);
});
document.addEventListener('keydown',ev=>{
  if(ev.target.closest&&ev.target.closest('input,textarea'))return;
  if(ev.key==='Escape'&&st.teamOpen){st.teamOpen=false;st.confirmDel=null;render()}
  if(st.teamOpen)return;
  if(ev.key==='ArrowLeft'){st.week=addDays(st.week,-7);render()}
  if(ev.key==='ArrowRight'){st.week=addDays(st.week,7);render()}
});

/* drag & drop between days */
let dragId=null;
app.addEventListener('dragstart',ev=>{const li=ev.target.closest&&ev.target.closest('.task[draggable="true"]');if(!li)return;commitEdit();dragId=li.dataset.id;li.classList.add('dragging');ev.dataTransfer.effectAllowed='move';try{ev.dataTransfer.setData('text/plain',dragId)}catch(e){}});
app.addEventListener('dragend',()=>{dragId=null;app.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'))});
app.addEventListener('dragover',ev=>{if(!dragId)return;const ul=ev.target.closest('ul.lines');if(!ul)return;ev.preventDefault();app.querySelectorAll('ul.over').forEach(x=>x!==ul&&x.classList.remove('over'));ul.classList.add('over')});
app.addEventListener('drop',ev=>{
  const ul=ev.target.closest('ul.lines'); if(!ul||!dragId)return; ev.preventDefault();
  const key=ul.dataset.key, list=tasksFor(key).filter(t=>t.id!==dragId);
  const over=ev.target.closest('.task'); let order=Date.now();
  if(over&&over.dataset.id!==dragId){
    const i=list.findIndex(t=>t.id===over.dataset.id);
    if(i>=0){const tgt=list[i].order||0;const prev=i>0?(list[i-1].order||0):tgt-1000;order=(prev+tgt)/2}
  }
  api.updTask(dragId,{date:key===SOMEDAY?null:key,order});
  dragId=null;
});

/* ---------- misc ---------- */
let toastT;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3800)}
setInterval(()=>{const t=iso(new Date());if(t!==st.today){st.today=t;if(!st.editing)render()}},60000);
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{const n=innerWidth<=560;if(n!==st.narrow){st.narrow=n;render()}},150)});

/* ---------- boot ---------- */
function startDemo(){
  st.demo=true;st.loading=false;st.isOwner=false;st.me='demo-me';
  const d=n=>iso(addDays(parse(st.today),n));
  st.members=[
    {id:'ana',name:'Ana (ejemplo)',color:PALETTE[4],uid:'demo-me',editOthers:false,order:1},
    {id:'luis',name:'Luis (ejemplo)',color:PALETTE[2],uid:null,editOthers:true,order:2},
    {id:'marta',name:'Marta (ejemplo)',color:PALETTE[5],uid:null,editOthers:false,order:3}
  ];
  let o=1;const T=(owner,text,date,done=false,status=null)=>({id:'t'+o,owner,text,date,done,status,order:o++});
  st.tasks=[
    T('ana','Revisar presupuesto proveedor',d(-2)),
    T('ana','Llamar a cliente Ortega',d(0),false,'proceso'),
    T('ana','Enviar factura septiembre',d(0),true),
    T('luis','Inventario almacén',d(0),false,'atascado'),
    T('luis','Pedido de material',d(1)),
    T('marta','Publicar novedades en web',d(-1),false,'proceso'),
    T('marta','Preparar reunión semanal',d(2)),
    T('ana','Actualizar listado de precios',d(3)),
    T('luis','Revisar furgoneta',null),
    T('marta','Ideas campaña Navidad',null)
  ];
  st.view=store('semana.view')&&st.members.some(m=>m.id===st.view)?st.view:'all';
  api=demoApi();render();
}

async function boot(){
  render();
  const c=window.claude;
  const db=c&&c.use?await c.use('db'):null;
  if(!db){startDemo();return}
  const user=await c.use('user');
  st.me=user?await user.id():null;
  st.isOwner=user?await user.isOwner():false;
  const w=user?await user.can('data.write'):null;
  if(w===false)st.readOnly=true;
  st.db=db;st.live=true;api=liveApi(db);
  let got=0;const ready=()=>{if(++got===2){st.loading=false;if(st.view!=='all'&&!memberById(st.view))st.view='all'}render()};
  let mFirst=true,tFirst=true;
  const onErr=e=>{if(e&&e.code!=='revoked')toast('Se perdió la conexión con los datos. Recarga la página.')};
  db.collection('members').onSnapshot(s=>{
    st.members=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
    if(mFirst){mFirst=false;ready()}else requestRender();
  },onErr);
  db.collection('tasks').onSnapshot(s=>{
    st.tasks=s.docs.map(d=>({id:d.id,...d.data()}));
    if(tFirst){tFirst=false;ready()}else requestRender();
  },onErr);
}
api=demoApi();
boot();
</script>
