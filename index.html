<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Semana del equipo</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151619" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Semana">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a paper week planner. Five weekday columns + one stacked weekend column, ruled lines, a "Someday" strip below. */
:root{
  --bg:#ffffff; --ink:#1c1d21; --muted:#8a8e97; --faint:#b9bcc3;
  --line:#ececef; --line-strong:#d9dade; --hover:#f5f6f8;
  --accent:#2b59e0; --accent-soft:#eaf0ff;
  --yellow:#e9b308; --yellow-bg:#fff3c4; --red:#e5484d; --red-bg:#fde0e0;
  --panel:#ffffff; --scrim:rgba(18,20,28,.32); --shadow:0 18px 50px rgba(20,24,40,.18);
  --font:"Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --row:34px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#151619; --ink:#ececef; --muted:#8c909a; --faint:#5d6169;
  --line:#25272c; --line-strong:#34363d; --hover:#1d1f23;
  --accent:#7f9dff; --accent-soft:#1f2740;
  --yellow:#e8b923; --yellow-bg:#3b3213; --red:#ff6b6e; --red-bg:#40191c;
  --panel:#1c1e22; --scrim:rgba(0,0,0,.55); --shadow:0 18px 50px rgba(0,0,0,.5);
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
#app{max-width:1500px;margin:0 auto;padding-inline:clamp(16px,3vw,40px);padding-block:22px 60px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.month{font-size:clamp(26px,3.4vw,40px);font-weight:800;letter-spacing:-.02em;margin:0;text-transform:capitalize;line-height:1.1}
.month span{color:var(--faint);font-weight:700}
.nav{display:flex;align-items:center;gap:6px}
.nav button{height:34px;min-width:34px;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-weight:600}
.nav button:hover{background:var(--hover);color:var(--ink)}
.nav .today-btn{padding-inline:12px;border:1px solid var(--line-strong);color:var(--ink)}
.nav .today-btn[disabled]{opacity:.4;cursor:default;background:none}
.nav svg{width:18px;height:18px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-block:16px 6px}
.people{display:flex;gap:4px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding-inline:12px;border-radius:999px;color:var(--muted);font-weight:500}
.chip:hover{background:var(--hover);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.side{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;flex-wrap:wrap}
.legend{display:flex;gap:12px;margin-right:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.tb{display:inline-flex;align-items:center;gap:6px;height:30px;padding-inline:10px;border-radius:8px;font-weight:500;color:var(--ink)}
.tb:hover{background:var(--hover)}
.tb svg{width:16px;height:16px}
.tb.install{color:var(--accent)}

.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:var(--accent-soft);margin-block:4px 10px;font-size:13.5px}

/* week grid */
.week{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));column-gap:22px;margin-top:8px}
.day{min-width:0;display:flex;flex-direction:column}
.weekend{display:flex;flex-direction:column;gap:18px;min-width:0}
.dh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.dh b{font-size:15px;font-weight:700}
.dh span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.day.past .dh{border-bottom-color:var(--line-strong)}
.day.past .dh b{color:var(--muted)}
.day.is-today .dh{border-bottom-color:var(--accent)}
.day.is-today .dh b,.day.is-today .dh span{color:var(--accent)}
ul.lines{list-style:none;margin:0;padding:0;flex:1}
ul.lines.over{background:var(--accent-soft);border-radius:6px}
.row{height:var(--row);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;position:relative;min-width:0}
.row.empty{cursor:text}
.row.empty.locked{cursor:default}
.task .txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:3px 6px;margin-left:-6px;border-radius:5px;line-height:1.35}
.task.can .txt{cursor:text}
.task.st-proceso .txt{background:var(--yellow-bg)}
.task.st-atascado .txt{background:var(--red-bg)}
.task.done .txt{color:var(--faint);text-decoration:line-through;background:none}
.st{width:14px;height:14px;flex:none;display:grid;place-items:center;margin-left:-2px;border-radius:50%}
.st::before{content:"";width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line-strong);transition:transform .12s}
.task:not(:hover) .st.none::before{box-shadow:none}
.st:hover::before{transform:scale(1.3)}
.st.proceso::before{background:var(--yellow);box-shadow:none}
.st.atascado::before{background:var(--red);box-shadow:none}
.task.done .st::before{opacity:.35}
.task:not(.can) .st{cursor:default}
.task:not(.can) .st:hover::before{transform:none}
.who{width:18px;height:18px;border-radius:50%;background:var(--c);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;flex:none}
.task.done .who{opacity:.4}
.roll{color:var(--faint);font-size:12px;flex:none;cursor:default}
.chk{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;color:transparent;box-shadow:inset 0 0 0 1.5px var(--line-strong);opacity:0;transition:opacity .1s}
.chk svg{width:11px;height:11px}
.task.can:hover .chk,.chk:focus-visible{opacity:1}
.chk:hover{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent)}
.task.done .chk{opacity:1;background:var(--line);box-shadow:none;color:var(--muted)}
.task[draggable="true"]{cursor:grab}
.task.dragging{opacity:.4}
.edit{flex:1;min-width:0;height:28px;border:0;background:transparent;color:var(--ink);font:inherit;outline:none;padding:0}
.row.editing{border-bottom-color:var(--accent)}

/* someday */
.someday{margin-top:42px}
.someday .dh{border-bottom-color:var(--line-strong)}
.someday .dh b{color:var(--muted)}
.someday ul.lines{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));column-gap:22px}

/* panels */
.scrim{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:start center;padding:8vh 16px 16px;z-index:10;overflow:auto}
.panel{width:min(640px,100%);background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:22px 22px 18px}
.panel.sm{width:min(420px,100%)}
.panel h2{margin:0 0 4px;font-size:20px;font-weight:700;letter-spacing:-.01em}
.sub{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.5;max-width:60ch}
.mem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding-block:12px;border-top:1px solid var(--line)}
.mem .sw{width:22px;height:22px;border-radius:50%;background:var(--c)}
.mem .name{font:inherit;font-size:15px;font-weight:600;color:var(--ink);background:transparent;border:0;border-bottom:1px solid transparent;padding:2px 0;width:100%}
.mem .name:hover,.mem .name:focus{border-bottom-color:var(--line-strong);outline:none}
.mem .meta{grid-column:2/4;display:flex;gap:16px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.mem .mailin{grid-column:2/4;font-size:12.5px;font-weight:400;color:var(--muted)}
.mem .mailin::placeholder{color:var(--faint)}
.mem .mail{grid-column:2/4;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.tog{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--ink);font-size:12.5px}
.tog input{appearance:none;-webkit-appearance:none;width:30px;height:18px;border-radius:999px;background:var(--line-strong);position:relative;cursor:pointer;margin:0;transition:background .15s}
.tog input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.tog input:checked{background:var(--accent)}
.tog input:checked::after{transform:translateX(12px)}
.tog input:disabled{opacity:.5;cursor:default}
.add{display:flex;gap:8px;margin-top:12px;border-top:1px solid var(--line);padding-top:14px;flex-wrap:wrap}
.add input{flex:1 1 160px}
.field{height:38px;border:1px solid var(--line-strong);border-radius:8px;padding-inline:12px;background:var(--bg);color:var(--ink);font:inherit;min-width:0;width:100%}
.btn{height:38px;padding-inline:16px;border-radius:8px;background:var(--ink);color:var(--bg);font-weight:600}
.btn[disabled]{opacity:.5;cursor:default}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line-strong)}
.link{color:var(--accent);font-weight:500;font-size:13px}
.panel .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.confirm{grid-column:2/4;display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--red)}
.confirm button{font-weight:600}
.del{color:var(--muted);font-size:12.5px}

/* auth */
.auth{min-height:80vh;display:grid;place-items:center}
.auth .card{width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
.auth h1{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
.auth label{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.auth .msg{font-size:13px;line-height:1.5;color:var(--muted)}
.auth .msg.err{color:var(--red)}
.auth .row2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.auth .lines-deco{height:72px;background:repeating-linear-gradient(to bottom,transparent 0 33px,var(--line) 33px 34px);margin-bottom:8px;border-top:2px solid var(--ink)}
.loading{min-height:60vh;display:grid;place-items:center;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}

@media (max-width:900px){
  .week{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:26px}
  .weekend{grid-column:span 2;display:grid;grid-template-columns:1fr 1fr;column-gap:22px}
}
@media (max-width:560px){
  .week{grid-template-columns:1fr}
  .weekend{grid-column:auto;grid-template-columns:1fr;row-gap:26px}
  .chk{opacity:.6}
  .legend{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="loading">Cargando…</div></div>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const MON=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MON3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const PALETTE=['#e5484d','#f76b15','#2f9e5a','#0d9488','#0b7bd6','#6e56cf','#c2378a','#8a6a00'];
const STATUS=[null,'proceso','atascado'];
const STATUS_LABEL={proceso:'En proceso',atascado:'Atascado'};
const SOMEDAY='someday';

const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-((x.getDay()+6)%7))};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtShort=s=>{const d=parse(s);return d.getDate()+' '+MON3[d.getMonth()]};
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

const st={
  screen:'loading', email:'', userId:null, authMsg:'', authErr:false, busy:false,
  members:[], tasks:[],
  view:store('semana.view')||'all',
  week:mondayOf(new Date()), today:iso(new Date()),
  editing:null, teamOpen:false, accountOpen:false, confirmDel:null,
  rendering:false, pending:false, narrow:innerWidth<=560, installEvt:null
};

/* ---------- permissions (the database enforces the same rules) ---------- */
const memberById=id=>st.members.find(m=>m.id===id)||null;
const myMember=()=>st.members.find(m=>m.email===st.email)||null;
function canEditFor(ownerId){
  const m=myMember();
  return !!m&&(m.is_admin||m.can_edit_others||m.id===ownerId);
}
const isAdmin=()=>!!(myMember()||{}).is_admin;
function newOwner(){
  if(st.view!=='all')return memberById(st.view)?st.view:null;
  const m=myMember();return m?m.id:null;
}
const canAdd=()=>{const o=newOwner();return !!o&&canEditFor(o)};

/* ---------- placement: unfinished past tasks roll to today ---------- */
function effKey(t){
  if(!t.date)return SOMEDAY;
  if(!t.done&&t.date<st.today)return st.today;
  return t.date;
}
const visible=t=>st.view==='all'||t.owner===st.view;
const tasksFor=key=>st.tasks.filter(t=>visible(t)&&effKey(t)===key).sort((a,b)=>(a.sort||0)-(b.sort||0));

/* ---------- Supabase ---------- */
const CFG=window.CONFIG||{};
const configured=CFG.SUPABASE_URL&&/^https:\/\//.test(CFG.SUPABASE_URL)&&CFG.SUPABASE_ANON_KEY&&!/PEGA_AQUI/.test(CFG.SUPABASE_ANON_KEY);
const sb=configured&&window.supabase?window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY):null;
let channel=null, inflight=0, refetchWanted=false, refetchTimer=null, loadSeq=0;

function errText(e){
  const c=e&&e.code;
  if(c==='42501'||/row-level security/i.test(e&&e.message||''))return 'No tienes permiso para hacer ese cambio.';
  if(c==='23505')return 'Ya hay alguien del equipo con ese correo.';
  if(!navigator.onLine)return 'Sin conexión. El cambio no se ha guardado.';
  return 'No se pudo guardar el cambio. Inténtalo de nuevo.';
}
async function write(fn){
  inflight++;
  try{const r=await fn();if(r&&r.error)throw r.error;return r}
  catch(e){toast(errText(e));refetchWanted=true;return null}
  finally{inflight--;if(!inflight&&refetchWanted)scheduleRefetch()}
}
function scheduleRefetch(){
  refetchWanted=true;
  clearTimeout(refetchTimer);
  refetchTimer=setTimeout(()=>{if(inflight)return;refetchWanted=false;loadAll()},250);
}
async function loadMembers(){
  const {data,error}=await sb.from('members').select('*').order('sort');
  if(error)throw error;
  st.members=data||[];
}
async function loadTasks(){
  const seq=++loadSeq, from=iso(st.week), to=iso(addDays(st.week,6));
  const {data,error}=await sb.from('tasks').select('id,owner,text,date,done,status,sort')
    .or(`done.eq.false,date.is.null,and(date.gte.${from},date.lte.${to})`).limit(5000);
  if(error)throw error;
  if(seq!==loadSeq)return;
  const local=st.tasks.filter(t=>String(t.id).startsWith('tmp-'));
  st.tasks=(data||[]).concat(local);
}
async function loadAll(){
  try{await Promise.all([loadMembers(),loadTasks()])}
  catch(e){toast('No se pudieron cargar los datos. Comprueba la conexión.');return}
  if(st.view!=='all'&&!memberById(st.view))st.view='all';
  if(!myMember()){enterSession();return}
  requestRender();
}

const pendingIds={};
const realId=async id=>String(id).startsWith('tmp-')?await pendingIds[id]:id;
let tmpN=0;
const api={
  addTask(d){
    const id='tmp-'+(++tmpN);
    st.tasks.push({id,...d});
    pendingIds[id]=write(()=>sb.from('tasks').insert(d).select('id').single()).then(r=>{
      const t=st.tasks.find(t=>t.id===id);
      if(r&&r.data){if(t)t.id=r.data.id;if(st.editing&&st.editing.id===id)st.editing.id=r.data.id;return r.data.id}
      st.tasks=st.tasks.filter(t=>t.id!==id);requestRender();return null;
    });
  },
  async updTask(id,p){
    const t=st.tasks.find(t=>t.id===id);if(t)Object.assign(t,p);
    const rid=await realId(id);if(rid)write(()=>sb.from('tasks').update(p).eq('id',rid));
  },
  async delTask(id){
    st.tasks=st.tasks.filter(t=>t.id!==id);
    const rid=await realId(id);if(rid)write(()=>sb.from('tasks').delete().eq('id',rid));
  },
  async addMember(d){const r=await write(()=>sb.from('members').insert(d));if(r)scheduleRefetch()},
  async updMember(id,p){const m=memberById(id);if(m)Object.assign(m,p);requestRender();await write(()=>sb.from('members').update(p).eq('id',id))},
  async delMember(id){
    st.members=st.members.filter(m=>m.id!==id);st.tasks=st.tasks.filter(t=>t.owner!==id);requestRender();
    await write(()=>sb.from('members').delete().eq('id',id));
  }
};

/* ---------- auth ---------- */
async function enterSession(){
  try{await loadMembers()}catch(e){if(st.screen==='recovery')return;st.screen='login';st.authMsg='No se pudo conectar con la base de datos.';st.authErr=true;render();return}
  if(st.screen==='recovery')return;
  if(myMember()){
    if(st.screen!=='app'){
      st.screen='app';
      try{await loadTasks()}catch(e){toast('No se pudieron cargar las tareas.')}
      subscribe();
    }
    render();return;
  }
  const {data:exists}=await sb.rpc('team_exists');
  if(st.screen==='recovery')return;
  st.screen=exists?'nomember':'setup';
  unsubscribe();
  render();
}
function subscribe(){
  if(channel)return;
  channel=sb.channel('cambios')
    .on('postgres_changes',{event:'*',schema:'public',table:'tasks'},scheduleRefetch)
    .on('postgres_changes',{event:'*',schema:'public',table:'members'},scheduleRefetch)
    .subscribe();
}
function unsubscribe(){if(channel){sb.removeChannel(channel);channel=null}}

async function onSession(event,session){
  if(event==='PASSWORD_RECOVERY'){st.screen='recovery';st.authMsg='';render();return}
  if(st.screen==='recovery')return;
  if(!session){
    unsubscribe();
    Object.assign(st,{screen:'login',email:'',userId:null,members:[],tasks:[],editing:null,teamOpen:false,accountOpen:false});
    render();return;
  }
  const same=st.userId===session.user.id&&st.screen==='app';
  st.userId=session.user.id;st.email=(session.user.email||'').toLowerCase();
  if(!same)enterSession();
}

/* ---------- rendering ---------- */
const app=document.getElementById('app');
const ICON={
  prev:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg>',
  next:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4.5 13 10l-5.5 5.5"/></svg>',
  check:'<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.3 5 8.7l4.5-5.4"/></svg>',
  team:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="7.5" cy="7" r="2.8"/><path d="M2.5 16c.6-2.8 2.6-4.3 5-4.3s4.4 1.5 5 4.3"/><circle cx="14" cy="7.8" r="2.2"/><path d="M13.6 11.8c2 .1 3.4 1.4 3.9 3.6"/></svg>',
  user:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10" cy="7" r="3.2"/><path d="M3.8 17c.8-3.2 3.3-5 6.2-5s5.4 1.8 6.2 5"/></svg>',
  install:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v9M6 8.5l4 4 4-4M4 16h12"/></svg>'
};

function monthTitle(){
  const a=st.week,b=addDays(st.week,6);
  if(a.getMonth()===b.getMonth())return `${MON[a.getMonth()]} <span>${a.getFullYear()}</span>`;
  const y=a.getFullYear()===b.getFullYear()?` <span>${b.getFullYear()}</span>`:` <span>${a.getFullYear()}/${b.getFullYear()}</span>`;
  return `${MON3[a.getMonth()]} – ${MON3[b.getMonth()]}${y}`;
}

function header(){
  const thisWeek=iso(st.week)===iso(mondayOf(parse(st.today)));
  const me=myMember();
  const chips=[`<button class="chip ${st.view==='all'?'on':''}" data-view="all">Todos</button>`]
    .concat(st.members.map(m=>`<button class="chip ${st.view===m.id?'on':''}" data-view="${esc(m.id)}"><span class="dot" style="--c:${esc(m.color)}"></span>${esc(m.name)}</button>`));
  return `<div class="top"><h1 class="month">${monthTitle()}</h1>
    <div class="nav">
      <button class="today-btn" data-act="today" ${thisWeek?'disabled':''}>Hoy</button>
      <button data-act="prev" aria-label="Semana anterior">${ICON.prev}</button>
      <button data-act="next" aria-label="Semana siguiente">${ICON.next}</button>
    </div></div>
    <div class="bar"><div class="people">${chips.join('')}</div>
      <div class="side"><div class="legend"><span><i style="background:var(--yellow)"></i>En proceso</span><span><i style="background:var(--red)"></i>Atascado</span></div>
      ${st.installEvt?`<button class="tb install" data-act="install">${ICON.install}Instalar app</button>`:''}
      <button class="tb" data-act="team">${ICON.team}Equipo</button>
      <button class="tb" data-act="account">${ICON.user}${esc(me?me.name:'Cuenta')}</button></div></div>`;
}

function taskRow(t){
  const e=st.editing;
  if(e&&e.id===t.id)return `<li class="row editing"><input class="edit" id="edit-input" value="${esc(e.draft)}" aria-label="Editar tarea" autocomplete="off" maxlength="500"></li>`;
  const can=canEditFor(t.owner), s=t.status||null, m=memberById(t.owner);
  const rolled=!t.done&&t.date&&t.date<st.today;
  return `<li class="row task ${can?'can':''} ${t.done?'done':''} ${s?'st-'+s:''}" data-id="${esc(t.id)}" ${can?'draggable="true"':''}>
    <button class="st ${s||'none'}" data-act="status" aria-label="Estado: ${s?STATUS_LABEL[s]:'sin etiqueta'}" title="${s?STATUS_LABEL[s]:(can?'Marcar estado':'')}" ${can?'':'tabindex="-1"'}></button>
    <span class="txt" title="${esc(t.text)}">${esc(t.text)}</span>
    ${rolled?`<span class="roll" title="Pendiente desde el ${fmtShort(t.date)}">↻</span>`:''}
    ${st.view==='all'&&m?`<span class="who" style="--c:${esc(m.color)}" title="${esc(m.name)}">${esc((m.name||'?').trim().charAt(0).toUpperCase())}</span>`:''}
    ${can?`<button class="chk" data-act="done" aria-label="${t.done?'Marcar como pendiente':'Completar'}">${ICON.check}</button>`:''}
  </li>`;
}

function lines(key,min){
  const list=tasksFor(key), e=st.editing, add=canAdd();
  let html=list.map(taskRow).join(''), usedNew=false;
  const total=Math.max(min,list.length+1);
  for(let i=list.length;i<total;i++){
    if(e&&!e.id&&e.key===key&&!usedNew){usedNew=true;html+=`<li class="row editing"><input class="edit" id="edit-input" value="${esc(e.draft)}" aria-label="Nueva tarea" autocomplete="off" maxlength="500"></li>`;continue}
    html+=`<li class="row empty ${add?'':'locked'}" data-key="${key}"></li>`;
  }
  return `<ul class="lines" data-key="${key}">${html}</ul>`;
}
function dayCol(i,min){
  const d=addDays(st.week,i),k=iso(d);
  const cls=k===st.today?'is-today':(k<st.today?'past':'');
  return `<section class="day ${cls}"><div class="dh"><b>${DAYS[i]}</b><span>${d.getDate()} ${MON3[d.getMonth()]}</span></div>${lines(k,min)}</section>`;
}
function week(){
  const wd=st.narrow?3:11, we=st.narrow?3:4;
  let h='<div class="week">';
  for(let i=0;i<5;i++)h+=dayCol(i,wd);
  return h+`<div class="weekend">${dayCol(5,we)}${dayCol(6,we)}</div></div>`;
}
const someday=()=>`<section class="someday"><div class="dh"><b>Algún día</b><span>sin fecha</span></div>${lines(SOMEDAY,st.narrow?3:8)}</section>`;

function teamPanel(){
  const admin=isAdmin(), me=myMember();
  const rows=st.members.map(m=>{
    const self=me&&me.id===m.id;
    const n=st.tasks.filter(t=>t.owner===m.id).length;
    const confirm=st.confirmDel===m.id
      ?`<div class="confirm">¿Eliminar a ${esc(m.name)} y todas sus tareas? <button data-act="del-yes" data-id="${esc(m.id)}">Eliminar</button><button data-act="del-no" style="color:var(--ink)">Cancelar</button></div>`:'';
    return `<div class="mem">
      <button class="sw" style="--c:${esc(m.color)}" ${admin?`data-act="color" data-id="${esc(m.id)}" title="Cambiar color"`:'disabled'} aria-label="Color de ${esc(m.name)}"></button>
      ${admin?`<input class="name" id="mname-${esc(m.id)}" data-id="${esc(m.id)}" value="${esc(m.name)}" aria-label="Nombre" maxlength="60">`:`<span class="name">${esc(m.name)}</span>`}
      ${admin&&!self?`<button class="del" data-act="del" data-id="${esc(m.id)}">Eliminar</button>`:'<span></span>'}
      ${admin&&!self
        ?`<input class="name mailin" id="mmail-${esc(m.id)}" data-id="${esc(m.id)}" type="email" value="${esc(m.email||'')}" placeholder="Sin cuenta propia · añade un correo si va a entrar desde otro dispositivo" aria-label="Correo de ${esc(m.name)}">`
        :`<div class="mail">${m.email?esc(m.email):'Sin cuenta propia'}${self?' · tú':''}</div>`}
      ${m.email?`<div class="meta">
        <label class="tog"><input type="checkbox" id="edit-${esc(m.id)}" data-act="perm" data-id="${esc(m.id)}" ${m.can_edit_others||m.is_admin?'checked':''} ${admin&&!m.is_admin?'':'disabled'}>Puede editar tareas de los demás</label>
        <label class="tog"><input type="checkbox" id="admin-${esc(m.id)}" data-act="admin" data-id="${esc(m.id)}" ${m.is_admin?'checked':''} ${admin&&!self?'':'disabled'}>Administrador</label>
      </div>`:''}${confirm}</div>`;
  }).join('');
  return `<div class="scrim" data-act="close-bg"><div class="panel" role="dialog" aria-modal="true" aria-labelledby="team-h">
    <h2 id="team-h">Equipo</h2>
    <p class="sub">Para añadir a alguien basta con su nombre. Sus tareas las puede editar cualquiera que use esta sesión, por ejemplo en el ordenador de la oficina. Si alguien va a entrar con su propia cuenta desde otro dispositivo, añade su correo y decide sus permisos.</p>
    ${rows}
    ${admin?`<form class="add" id="add-form"><input class="field" id="new-name" placeholder="Nombre" autocomplete="off" maxlength="60" required><input class="field" id="new-email" type="email" placeholder="Correo (opcional)" autocomplete="off"><button class="btn" type="submit">Añadir</button></form>
      <p class="sub" style="margin:10px 0 0">Si pones un correo, crea también su usuario en Supabase (Authentication → Users → Add user) con ese mismo correo y una contraseña inicial.</p>`:''}
    <div class="foot"><button class="btn ghost" data-act="close">Cerrar</button></div>
  </div></div>`;
}

function accountPanel(){
  const me=myMember();
  return `<div class="scrim" data-act="close-bg"><div class="panel sm" role="dialog" aria-modal="true" aria-labelledby="acc-h">
    <h2 id="acc-h">${esc(me?me.name:'Tu cuenta')}</h2>
    <p class="sub">${esc(st.email)}</p>
    <form id="pass-form" style="display:flex;flex-direction:column;gap:8px">
      <label class="sub" style="margin:0" for="acc-pass">Nueva contraseña</label>
      <input class="field" id="acc-pass" type="password" minlength="8" autocomplete="new-password" placeholder="Mínimo 8 caracteres" required>
      <button class="btn" type="submit">Cambiar contraseña</button>
    </form>
    <div class="foot"><button class="btn ghost" data-act="logout">Cerrar sesión</button><button class="btn ghost" data-act="close">Cerrar</button></div>
  </div></div>`;
}

function authScreen(){
  const msg=st.authMsg?`<p class="msg ${st.authErr?'err':''}">${esc(st.authMsg)}</p>`:'';
  const dis=st.busy?'disabled':'';
  let body='';
  if(st.screen==='config')body=`<h1>Falta un paso</h1><p class="msg">Abre <b>config.js</b> y pega la URL y la clave pública (anon key) de tu proyecto de Supabase. Las encontrarás en Supabase → Project Settings → API.</p>`;
  else if(st.screen==='login')body=`<h1>Semana</h1><div class="lines-deco"></div>
    <form id="login-form" style="display:contents">
      <label>Correo<input class="field" id="login-email" type="email" autocomplete="email" required></label>
      <label>Contraseña<input class="field" id="login-pass" type="password" autocomplete="current-password" required></label>
      ${msg}
      <div class="row2"><button class="link" type="button" data-act="forgot">¿Olvidaste la contraseña?</button><button class="btn" type="submit" ${dis}>Entrar</button></div>
    </form>`;
  else if(st.screen==='recovery')body=`<h1>Nueva contraseña</h1>
    <form id="recovery-form" style="display:contents">
      <label>Contraseña nueva<input class="field" id="rec-pass" type="password" minlength="8" autocomplete="new-password" required></label>
      ${msg}<div class="row2"><span></span><button class="btn" type="submit" ${dis}>Guardar</button></div></form>`;
  else if(st.screen==='setup')body=`<h1>Crea tu equipo</h1>
    <p class="msg">Eres la primera persona en entrar. Escribe tu nombre: serás el administrador y podrás añadir al resto desde “Equipo”.</p>
    <form id="setup-form" style="display:contents">
      <label>Tu nombre<input class="field" id="setup-name" maxlength="60" autocomplete="name" required></label>
      ${msg}<div class="row2"><button class="link" type="button" data-act="logout">Salir</button><button class="btn" type="submit" ${dis}>Empezar</button></div></form>`;

    <p class="msg">Has entrado como <b>${esc(st.email)}</b>, pero este correo no está en el equipo. Pide al administrador que te añada en “Equipo” con este mismo correo.</p>
    <div class="row2"><button class="link" type="button" data-act="logout">Salir</button><button class="btn" type="button" data-act="retry">Volver a comprobar</button></div>`;

}

function render(){
  const a=document.activeElement;
  if(st.screen==='app'&&a&&a.tagName==='INPUT'&&a.id!=='edit-input'&&app.contains(a)&&a.type!=='checkbox'){st.pending=true;return}
  st.pending=false;
  if(st.screen==='loading'){app.innerHTML='<div class="loading">Cargando…</div>';return}
  if(st.screen!=='app'){
    const vals={};app.querySelectorAll('input').forEach(i=>{if(i.id)vals[i.id]=i.value});
    app.innerHTML=authScreen();
    app.querySelectorAll('input').forEach(i=>{if(vals[i.id])i.value=vals[i.id]});
    const f=app.querySelector('input');if(f&&!a?.closest?.('.auth'))f.focus();
    return;
  }
  const caret=a&&a.id==='edit-input'?a.selectionStart:null;
  st.rendering=true;
  app.innerHTML=header()+week()+someday()+(st.teamOpen?teamPanel():'')+(st.accountOpen?accountPanel():'');
  st.rendering=false;
  const inp=document.getElementById('edit-input');
  if(inp){inp.focus();const p=caret??inp.value.length;try{inp.setSelectionRange(p,p)}catch(e){}}
}

/* While a pointer is down, hold back re-renders so the element under it survives until its click. */
let pointerDown=false, needRender=false;
function requestRender(){if(pointerDown)needRender=true;else render()}
document.addEventListener('mousedown',()=>{pointerDown=true},true);
document.addEventListener('mouseup',()=>setTimeout(()=>{pointerDown=false;if(needRender){needRender=false;render()}}),true);

/* ---------- editing ---------- */
function commitEdit(){
  const e=st.editing;if(!e)return;
  st.editing=null;
  const text=(e.draft||'').trim();
  if(e.id){
    const t=st.tasks.find(t=>t.id===e.id);if(!t)return;
    if(!text)api.delTask(e.id);else if(text!==t.text)api.updTask(e.id,{text});
  }else if(text){
    api.addTask({owner:e.owner,text,date:e.key===SOMEDAY?null:e.key,done:false,status:null,sort:Date.now()});
  }
}
function startNew(key){
  const owner=newOwner();
  if(!owner||!canEditFor(owner))return;
  commitEdit();st.editing={key,owner,draft:''};render();
}
function startEdit(id){
  const t=st.tasks.find(t=>t.id===id);if(!t||!canEditFor(t.owner))return;
  commitEdit();st.editing={id,draft:t.text};render();
}
function toggleDone(id){
  const t=st.tasks.find(t=>t.id===id);if(!t||!canEditFor(t.owner))return;
  commitEdit();
  const p={done:!t.done};
  if(!t.done&&t.date&&t.date<st.today)p.date=st.today;
  api.updTask(id,p);render();
}
function cycleStatus(id){
  const t=st.tasks.find(t=>t.id===id);if(!t||!canEditFor(t.owner))return;
  commitEdit();
  api.updTask(id,{status:STATUS[(STATUS.indexOf(t.status||null)+1)%STATUS.length]});render();
}
function goWeek(d){commitEdit();st.week=d;render();loadTasks().then(requestRender).catch(()=>toast('No se pudieron cargar las tareas.'))}

app.addEventListener('mousedown',ev=>{
  if(ev.button!==0||st.screen!=='app')return;
  const el=ev.target.closest('[data-act="done"],[data-act="status"],.row.empty');
  if(!el)return;
  ev.preventDefault();
  const li=el.closest('li');
  if(el.matches('[data-act="done"]'))toggleDone(li.dataset.id);
  else if(el.matches('[data-act="status"]'))cycleStatus(li.dataset.id);
  else startNew(li.dataset.key);
});

app.addEventListener('click',async ev=>{
  const t=ev.target;
  const txt=t.closest('.task.can .txt');
  if(txt){startEdit(txt.closest('li').dataset.id);return}
  if(ev.detail===0){
    const b=t.closest('[data-act="done"],[data-act="status"]');
    if(b){const id=b.closest('li').dataset.id;b.dataset.act==='done'?toggleDone(id):cycleStatus(id);return}
  }
  const v=t.closest('[data-view]');
  if(v){st.view=v.dataset.view;store('semana.view',st.view);commitEdit();render();return}
  const a=t.closest('[data-act]');if(!a)return;
  const act=a.dataset.act, id=a.dataset.id;
  if(act==='close-bg'&&t!==a)return;
  switch(act){
    case 'prev':goWeek(addDays(st.week,-7));break;
    case 'next':goWeek(addDays(st.week,7));break;
    case 'today':goWeek(mondayOf(parse(st.today)));break;
    case 'team':commitEdit();st.teamOpen=true;render();break;
    case 'account':commitEdit();st.accountOpen=true;render();break;
    case 'close':case 'close-bg':st.teamOpen=false;st.accountOpen=false;st.confirmDel=null;render();break;
    case 'color':{const m=memberById(id);api.updMember(id,{color:PALETTE[(PALETTE.indexOf(m.color)+1)%PALETTE.length]});break}
    case 'del':st.confirmDel=id;render();break;
    case 'del-no':st.confirmDel=null;render();break;
    case 'del-yes':st.confirmDel=null;if(st.view===id){st.view='all';store('semana.view','all')}api.delMember(id);break;
    case 'install':if(st.installEvt){st.installEvt.prompt();await st.installEvt.userChoice.catch(()=>{});st.installEvt=null;render()}break;
    case 'logout':await sb.auth.signOut();break;
    case 'retry':enterSession();break;
    case 'forgot':{
      const email=(document.getElementById('login-email')||{}).value||'';
      if(!email.trim()){st.authMsg='Escribe tu correo y vuelve a pulsar “¿Olvidaste la contraseña?”.';st.authErr=true;render();break}
      const {error}=await sb.auth.resetPasswordForEmail(email.trim(),{redirectTo:location.origin+location.pathname});
      st.authMsg=error?'No se pudo enviar el correo. Inténtalo más tarde o pide al administrador que cambie tu contraseña.':'Te hemos enviado un correo con un enlace para crear una contraseña nueva.';
      st.authErr=!!error;render();break;
    }
  }
});

app.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.act==='perm')api.updMember(t.dataset.id,{can_edit_others:t.checked});
  else if(t.dataset.act==='admin')api.updMember(t.dataset.id,{is_admin:t.checked});
  else if(t.classList.contains('mailin')){
    const m=memberById(t.dataset.id), v=t.value.trim().toLowerCase()||null;
    if(!m||v===(m.email||null))return;
    if(v&&!t.checkValidity()){toast('Ese correo no parece válido.');return}
    api.updMember(t.dataset.id,{email:v});
  }
  else if(t.classList.contains('name')&&t.dataset.id){const v=t.value.trim();const m=memberById(t.dataset.id);if(v&&m&&v!==m.name)api.updMember(t.dataset.id,{name:v})}
});

app.addEventListener('submit',async ev=>{
  ev.preventDefault();
  const f=ev.target.id, val=id=>(document.getElementById(id)||{}).value||'';
  if(f==='add-form'){
    const name=val('new-name').trim(), email=val('new-email').trim().toLowerCase()||null;
    if(!name)return;
    const used=st.members.map(m=>m.color);
    const color=PALETTE.find(c=>!used.includes(c))||PALETTE[st.members.length%PALETTE.length];
    document.getElementById('new-name').value='';document.getElementById('new-email').value='';
    await api.addMember({name,email,color,is_admin:false,can_edit_others:false,sort:Date.now()/1000});
    const n=document.getElementById('new-name');n&&n.focus();
    return;
  }
  if(f==='pass-form'){
    const {error}=await sb.auth.updateUser({password:val('acc-pass')});
    toast(error?'No se pudo cambiar la contraseña: '+(error.message||''):'Contraseña cambiada.');
    if(!error){st.accountOpen=false;render()}
    return;
  }
  st.busy=true;st.authMsg='';render();
  if(f==='login-form'){
    const {error}=await sb.auth.signInWithPassword({email:val('login-email').trim(),password:val('login-pass')});
    if(error){st.authMsg=/invalid/i.test(error.message)?'Correo o contraseña incorrectos.':/confirm/i.test(error.message)?'Este correo todavía no está confirmado.':'No se pudo entrar. Comprueba la conexión.';st.authErr=true}
  }else if(f==='recovery-form'){
    const {error}=await sb.auth.updateUser({password:val('rec-pass')});
    if(error){st.authMsg='No se pudo guardar: '+(error.message||'');st.authErr=true}
    else{st.screen='loading';history.replaceState(null,'',location.pathname);const {data}=await sb.auth.getSession();st.busy=false;onSession('SIGNED_IN',data.session);return}
  }else if(f==='setup-form'){
    const {error}=await sb.rpc('claim_first_admin',{p_name:val('setup-name').trim()});
    if(error){st.authMsg=/administrador/.test(error.message)?'El equipo ya existe. Pide al administrador que te añada.':'No se pudo crear el equipo: '+error.message;st.authErr=true}
    else{st.busy=false;await enterSession();return}
  }
  st.busy=false;render();
});

app.addEventListener('input',ev=>{if(ev.target.id==='edit-input'&&st.editing)st.editing.draft=ev.target.value});
app.addEventListener('keydown',ev=>{
  if(ev.target.id!=='edit-input')return;
  if(ev.key==='Enter'){ev.preventDefault();const e=st.editing;commitEdit();if(e&&!e.id&&e.draft.trim())st.editing={key:e.key,owner:e.owner,draft:''};render()}
  else if(ev.key==='Escape'){st.editing=null;render()}
});
app.addEventListener('focusout',ev=>{
  if(st.rendering)return;
  if(ev.target.id==='edit-input'){commitEdit();setTimeout(requestRender)}
  else if(st.pending)setTimeout(requestRender);
});
document.addEventListener('keydown',ev=>{
  if(st.screen!=='app'||(ev.target.closest&&ev.target.closest('input,textarea')))return;
  if(ev.key==='Escape'&&(st.teamOpen||st.accountOpen)){st.teamOpen=st.accountOpen=false;st.confirmDel=null;render()}
  if(st.teamOpen||st.accountOpen)return;
  if(ev.key==='ArrowLeft')goWeek(addDays(st.week,-7));
  if(ev.key==='ArrowRight')goWeek(addDays(st.week,7));
});

/* drag & drop between days */
let dragId=null;
app.addEventListener('dragstart',ev=>{const li=ev.target.closest&&ev.target.closest('.task[draggable="true"]');if(!li)return;commitEdit();dragId=li.dataset.id;li.classList.add('dragging');ev.dataTransfer.effectAllowed='move';try{ev.dataTransfer.setData('text/plain',dragId)}catch(e){}});
app.addEventListener('dragend',()=>{dragId=null;app.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'));requestRender()});
app.addEventListener('dragover',ev=>{if(!dragId)return;const ul=ev.target.closest('ul.lines');if(!ul)return;ev.preventDefault();app.querySelectorAll('ul.over').forEach(x=>x!==ul&&x.classList.remove('over'));ul.classList.add('over')});
app.addEventListener('drop',ev=>{
  const ul=ev.target.closest('ul.lines');if(!ul||!dragId)return;ev.preventDefault();
  const key=ul.dataset.key, list=tasksFor(key).filter(t=>t.id!==dragId);
  const over=ev.target.closest('.task');let sort=Date.now();
  if(over&&over.dataset.id!==dragId){
    const i=list.findIndex(t=>t.id===over.dataset.id);
    if(i>=0){const tgt=list[i].sort||0;const prev=i>0?(list[i-1].sort||0):tgt-1000;sort=(prev+tgt)/2}
  }
  api.updTask(dragId,{date:key===SOMEDAY?null:key,sort});
  dragId=null;render();
});

/* ---------- misc ---------- */
let toastT;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,4000)}
function checkDay(){const t=iso(new Date());if(t!==st.today){st.today=t;if(!st.editing)requestRender()}}
setInterval(checkDay,60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&st.screen==='app'){checkDay();scheduleRefetch()}});
addEventListener('online',()=>{if(st.screen==='app')scheduleRefetch()});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{const n=innerWidth<=560;if(n!==st.narrow){st.narrow=n;requestRender()}},150)});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();st.installEvt=e;if(st.screen==='app')requestRender()});
addEventListener('appinstalled',()=>{st.installEvt=null;requestRender()});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ---------- boot ---------- */
if(!sb){st.screen=configured?'login':'config';if(configured){st.authMsg='No se pudo cargar la conexión con Supabase. Comprueba tu conexión y recarga.';st.authErr=true}render()}
else{
  if(/type=recovery/.test(location.hash)){st.screen='recovery';render()}
  sb.auth.onAuthStateChange((event,session)=>setTimeout(()=>onSession(event,session),0));
}
</script>
